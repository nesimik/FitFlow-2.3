name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: APK derle
        run: |
          # Proje repo kökünde değil de bir alt klasöre yüklendiyse onu otomatik bul.
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle.kts bulunamadı. Proje dosyaları eksik yüklenmiş."
            find . -maxdepth 3 -not -path "./.git*" | head -60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proje klasörü: $DIR"
          cd "$DIR"
          [ -f .env.example ] || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          gradle assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-Pro-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
