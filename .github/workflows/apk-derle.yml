name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: APK derle
        run: |
          # Proje repo kökünde değil de bir alt klasöre yüklendiyse onu otomatik bul.
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle.kts bulunamadı. Proje dosyaları eksik yüklenmiş."
            find . -maxdepth 3 -not -path "./.git*" | head -60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proje klasörü: $DIR"
          cd "$DIR"
          [ -f .env.example ] || echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # Derleyici hatalarını GitHub notu (annotation) olarak da yaz: kayıt indirilemese bile okunabilsin.
            grep -E "^e: |error:|What went wrong|> Task .* FAILED|Execution failed" -A2 "$GITHUB_WORKSPACE/build.log" \
              | grep -v "^--$" | head -120 > "$GITHUB_WORKSPACE/errors.txt" || true
            split -l 12 "$GITHUB_WORKSPACE/errors.txt" "$GITHUB_WORKSPACE/errpart_" || true
            for f in "$GITHUB_WORKSPACE"/errpart_*; do
              [ -f "$f" ] || continue
              MSG=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=Derleme hatası::$MSG"
            done
            exit "$STATUS"
          fi

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FitFlow-Pro-APK
          path: '**/app/build/outputs/apk/debug/*.apk'

      # Telefondan doğrudan kurulum: her başarılı derleme FitFlow.apk olarak "Releases"e yayımlanır.
      # Sabit bağlantı: https://github.com/nesimik/FitFlow-2.3/releases/latest/download/FitFlow.apk
      - name: Sürümü yayımla
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -1)
          GRADLE=$(find . -path "*/app/build.gradle.kts" -not -path "./.git/*" | head -1)
          V=$(grep -m1 'versionName' "$GRADLE" | sed -E 's/.*"(.*)".*/\1/')
          cp "$APK" FitFlow.apk
          git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > notes.txt
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" FitFlow.apk --title "FitFlow $V" --notes-file notes.txt --latest --target "$GITHUB_SHA"
